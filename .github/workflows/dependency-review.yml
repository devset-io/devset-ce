name: Dependency submission

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'devset-ce-be/**'
      - '.github/workflows/dependency-review.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gradle:
    name: Gradle (devset-ce-be)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25

      - name: Generate and submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          build-root-directory: devset-ce-be
        env:
          # Exclude the Gradle buildscript/plugin classpath (config name: "classpath").
          # It pulls jackson-databind transitively via spring-boot-gradle-plugin ->
          # spring-boot-buildpack-platform, a build-time-only dependency never shipped
          # in the app, at whatever version that plugin bundles - independent of the
          # app's own (BOM-managed) jackson-databind version. Without this exclusion it
          # leaks into the graph and triggers false Dependabot alerts.
          DEPENDENCY_GRAPH_EXCLUDE_CONFIGURATIONS: '^classpath$'